[project]
name = "rl-webgl-landing-pages"
version = "0.1.0"
description = "Synthetic pipeline for generating RL tasks for WebGL landing page coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
