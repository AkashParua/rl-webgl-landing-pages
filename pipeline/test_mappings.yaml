# Test mappings for generated Playwright suites.
# Each attribute value can declare an `assert` block that the generator turns into real checks.
#
# assert.type:
#   style_changes     – computed style property must change and optionally contain a substring
#   attribute_toggles – an attribute value must change
#   element_appears   – a selector must become visible after the action
#   class_added       – a class must be present after the action
#   visible           – fallback: element stays visible (weak)

selector: '[data-component="{type}"]'

components:
  nav:
    presence: true
    attributes:
      hover_behavior:
        underline:
          action: hover
          assert: { type: style_changes, property: text-decoration }
        color-shift:
          action: hover
          assert: { type: style_changes, property: color }
        scale:
          action: hover
          assert: { type: style_changes, property: transform, contains: "scale" }
        glow:
          action: hover
          assert: { type: style_changes, property: box-shadow }

  headline:
    presence: true
    attributes:
      animation:
        fade-in:
          action: wait
          assert: { type: visible }
        slide-up:
          action: wait
          assert: { type: style_changes, property: transform }
        typewriter:
          action: wait
          assert: { type: visible }
        letter-stagger:
          action: wait
          assert: { type: visible }

  subheadline:
    presence: true
    attributes:
      animation:
        fade-in-delayed:
          action: wait
          assert: { type: visible }
        slide-up:
          action: wait
          assert: { type: style_changes, property: transform }

  cta_button:
    presence: true
    attributes:
      hover_behavior:
        scale-up:
          action: hover
          assert: { type: style_changes, property: transform, contains: "scale" }
        glow:
          action: hover
          assert: { type: style_changes, property: box-shadow }
        color-shift:
          action: hover
          assert: { type: style_changes, property: background-color }
        underline-sweep:
          action: hover
          assert: { type: style_changes, property: text-decoration }
        particle-burst:
          action: hover
          assert: { type: element_appears, selector: "[data-particle], .particle, .particles" }
        magnetic:
          action: hover
          assert: { type: style_changes, property: transform }
      click_behavior:
        ripple:
          action: click
          assert: { type: element_appears, selector: "[data-ripple], .ripple" }
        toggle-state:
          action: click
          assert: { type: attribute_toggles, name: "aria-pressed" }
        cycle-palette:
          action: click
          assert: { type: style_changes, property: background-color }
        spawn-element:
          action: click
          assert: { type: element_appears, selector: "[data-spawned], .spawned" }
        trigger-animation:
          action: click
          assert: { type: class_added, class: "animating" }
        navigate-section:
          action: click
          assert: { type: visible }
      right_click_behavior:
        show-tooltip:
          action: right-click
          assert: { type: element_appears, selector: "[role=tooltip], .tooltip, [data-tooltip]" }
        reset:
          action: right-click
          assert: { type: visible }
        secondary-action:
          action: right-click
          assert: { type: visible }

  secondary_button:
    presence: true
    attributes:
      hover_behavior:
        opacity:
          action: hover
          assert: { type: style_changes, property: opacity }
        underline:
          action: hover
          assert: { type: style_changes, property: text-decoration }
        scale:
          action: hover
          assert: { type: style_changes, property: transform, contains: "scale" }
      click_behavior:
        scroll-to:
          action: click
          assert: { type: visible }
        open-modal-visual:
          action: click
          assert: { type: element_appears, selector: "[role=dialog], .modal, [data-modal]" }

  webgl_canvas:
    presence: true
    attributes:
      drag_behavior:
        rotate-object:
          action: drag
          assert: { type: visible }
        pan-camera:
          action: drag
          assert: { type: visible }
        orbit-controls:
          action: drag
          assert: { type: visible }
        scrub-timeline:
          action: drag
          assert: { type: visible }
      zoom_behavior:
        dolly-camera:
          action: wheel
          assert: { type: visible }
        scale-focal:
          action: wheel
          assert: { type: visible }
        reveal-detail:
          action: wheel
          assert: { type: visible }
      hover_behavior:
        highlight-object:
          action: hover
          assert: { type: visible }
        tooltip:
          action: hover
          assert: { type: element_appears, selector: "[role=tooltip], .tooltip" }
        slow-motion:
          action: hover
          assert: { type: visible }
      click_behavior:
        select-object:
          action: click
          assert: { type: class_added, class: "selected" }
        explode-view:
          action: click
          assert: { type: visible }
        change-material:
          action: click
          assert: { type: visible }
        toggle-wireframe:
          action: click
          assert: { type: class_added, class: "wireframe" }
      right_click_behavior:
        reset-camera:
          action: right-click
          assert: { type: visible }
        context-visual:
          action: right-click
          assert: { type: element_appears, selector: "[data-context], .context-menu" }

  card:
    presence: true
    attributes:
      hover_behavior:
        lift:
          action: hover
          assert: { type: style_changes, property: transform }
        tilt-3d:
          action: hover
          assert: { type: style_changes, property: transform }
        glow-border:
          action: hover
          assert: { type: style_changes, property: box-shadow }
        image-zoom:
          action: hover
          assert: { type: style_changes, property: transform }
      click_behavior:
        expand:
          action: click
          assert: { type: class_added, class: "expanded" }
        flip:
          action: click
          assert: { type: style_changes, property: transform }

  icon_grid:
    presence: true
    attributes:
      hover_behavior:
        bounce:
          action: hover
          assert: { type: style_changes, property: transform }
        color:
          action: hover
          assert: { type: style_changes, property: color }
        scale:
          action: hover
          assert: { type: style_changes, property: transform, contains: "scale" }

  gallery:
    presence: true
    attributes:
      interaction:
        hover-preview:
          action: hover
          assert: { type: element_appears, selector: "[data-preview], .preview" }
        click-lightbox-visual:
          action: click
          assert: { type: element_appears, selector: "[data-lightbox], .lightbox" }
        drag-reorder:
          action: drag
          assert: { type: visible }

  feature_section:
    presence: true
  showcase:
    presence: true
  control_panel:
    presence: true
  testimonial:
    presence: true
  footer:
    presence: true
  background_effect:
    presence: true
  text_block:
    presence: true
    attributes:
      animation:
        fade-in-on-scroll:
          action: scroll
          assert: { type: visible }
